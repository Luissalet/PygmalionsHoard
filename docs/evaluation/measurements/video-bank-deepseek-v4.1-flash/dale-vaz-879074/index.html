<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sahi Trading Terminal</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  #stage { width: 1280px; height: 720px; position: relative; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
<script>
(function(){
  "use strict";
  const W = 1280, H = 720;
  window.DURATION = 46;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  // ---------- seeded rng ----------
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  // ---------- easing ----------
  function clamp(x,a,b){ return x<a?a:x>b?b:x; }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function smoothstep(a,b,x){ x=clamp((x-a)/(b-a),0,1); return x*x*(3-2*x); }
  function easeInOutCubic(t){ return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
  function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
  function easeInCubic(t){ return t*t*t; }
  function easeOutBack(t){ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }

  // ---------- time segments ----------
  // 0-3   : single dot
  // 3-10  : windows appear (charts, positions, option chain, watchlist)
  // 10-18 : zoom in / out at multiple scales
  // 18-26 : camera zooms out, desktop becomes point
  // 26-33 : zoom back in to reveal mobile landscape
  // 33-46 : mobile screen trading, ends with title
  const T = {
    dot: 3.0,
    appear: 9.5,
    zoom1: 18.0,
    pullback: 26.0,
    mobile: 33.0,
    end: 46.0
  };

  // ---------- palette ----------
  const C = {
    bg: '#05070d',
    panel: '#0b1220',
    panelHi: '#111b2e',
    border: '#1c2a44',
    borderHi: '#2b3f63',
    text: '#c9d6ee',
    dim: '#6b7b98',
    accent: '#4fd1ff',
    accent2: '#7c5cff',
    green: '#2ee6a6',
    red: '#ff5c7a',
    yellow: '#ffcf5c',
    grid: '#0f1a2e'
  };

  // ---------- tiny drawing helpers ----------
  function roundRect(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function panel(x,y,w,h,title,accent){
    ctx.save();
    // glow
    ctx.shadowColor = accent || 'rgba(79,209,255,0.35)';
    ctx.shadowBlur = 24;
    ctx.fillStyle = C.panel;
    roundRect(x,y,w,h,10);
    ctx.fill();
    ctx.restore();
    // border
    ctx.strokeStyle = C.borderHi;
    ctx.lineWidth = 1;
    roundRect(x+0.5,y+0.5,w-1,h-1,10);
    ctx.stroke();
    // title bar
    ctx.fillStyle = 'rgba(79,209,255,0.08)';
    roundRect(x,y,w,26,10);
    ctx.fill();
    ctx.fillStyle = 'rgba(79,209,255,0.16)';
    ctx.fillRect(x, y+16, w, 10);
    // title
    ctx.fillStyle = C.text;
    ctx.font = '600 12px -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(title, x+12, y+13);
    // dots
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.arc(x+w-14-i*12, y+13, 3, 0, Math.PI*2);
      ctx.fillStyle = i===0?C.red:(i===1?C.yellow:C.green);
      ctx.fill();
    }
    // accent line
    ctx.strokeStyle = accent || C.accent;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x+8, y+26);
    ctx.lineTo(x+w-8, y+26);
    ctx.stroke();
  }

  // ---------- chart drawing ----------
  function drawChart(x,y,w,h,t,seed){
    const rng = mulberry32(seed);
    const n = 80;
    const pts = [];
    let v = 0.5;
    for(let i=0;i<n;i++){
      v += (rng()-0.5)*0.08;
      v = clamp(v, 0.15, 0.85);
      pts.push(v);
    }
    // animated reveal
    const reveal = clamp((t - 3.5)/2.5, 0, 1);
    const shown = Math.floor(reveal * n);
    // grid
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    for(let i=1;i<5;i++){
      ctx.beginPath();
      ctx.moveTo(x+8, y+8 + (h-16)*i/5);
      ctx.lineTo(x+w-8, y+8 + (h-16)*i/5);
      ctx.stroke();
    }
    for(let i=1;i<6;i++){
      ctx.beginPath();
      ctx.moveTo(x+8 + (w-16)*i/6, y+8);
      ctx.lineTo(x+8 + (w-16)*i/6, y+h-8);
      ctx.stroke();
    }
    // area
    if(shown > 1){
      const gx = (i)=> x+8 + (w-16)*i/(n-1);
      const gy = (i)=> y+h-8 - (h-16)*pts[i];
      ctx.beginPath();
      ctx.moveTo(gx(0), y+h-8);
      for(let i=0;i<shown;i++) ctx.lineTo(gx(i), gy(i));
      ctx.lineTo(gx(shown-1), y+h-8);
      ctx.closePath();
      const g = ctx.createLinearGradient(0, y, 0, y+h);
      g.addColorStop(0, 'rgba(79,209,255,0.35)');
      g.addColorStop(1, 'rgba(79,209,255,0.0)');
      ctx.fillStyle = g;
      ctx.fill();
      // line
      ctx.beginPath();
      for(let i=0;i<shown;i++){
        if(i===0) ctx.moveTo(gx(i), gy(i));
        else ctx.lineTo(gx(i), gy(i));
      }
      ctx.strokeStyle = C.accent;
      ctx.lineWidth = 1.6;
      ctx.stroke();
      // moving dot
      const last = shown-1;
      const pulse = 0.5 + 0.5*Math.sin(t*6);
      ctx.beginPath();
      ctx.arc(gx(last), gy(last), 3 + pulse*2, 0, Math.PI*2);
      ctx.fillStyle = C.accent;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(gx(last), gy(last), 7 + pulse*4, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(79,209,255,'+(0.4*(1-pulse))+')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    // price labels
    ctx.fillStyle = C.dim;
    ctx.font = '9px monospace';
    ctx.textBaseline = 'middle';
    for(let i=0;i<5;i++){
      const val = (1 - i/5) * 100 + 50;
      ctx.fillText(val.toFixed(0), x+2, y+8 + (h-16)*i/5);
    }
  }

  // ---------- option chain ----------
  function drawOptionChain(x,y,w,h,t,seed){
    const rng = mulberry32(seed);
    const rows = 8;
    const rowH = (h-30)/rows;
    // header
    ctx.fillStyle = C.dim;
    ctx.font = '600 9px -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
    ctx.textBaseline = 'middle';
    const cols = ['CALL OI','CALL LTP','STRIKE','PUT LTP','PUT OI'];
    const colX = [0.1, 0.3, 0.5, 0.7, 0.9];
    cols.forEach((c,i)=>{
      ctx.fillText(c, x + w*colX[i] - ctx.measureText(c).width/2, y+16);
    });
    // rows
    for(let i=0;i<rows;i++){
      const ry = y + 30 + i*rowH;
      const strike = 24000 + i*50;
      const isATM = i===4;
      if(isATM){
        ctx.fillStyle = 'rgba(124,92,255,0.12)';
        ctx.fillRect(x+4, ry, w-8, rowH);
      }
      ctx.strokeStyle = 'rgba(28,42,68,0.6)';
      ctx.beginPath();
      ctx.moveTo(x+4, ry+rowH);
      ctx.lineTo(x+w-4, ry+rowH);
      ctx.stroke();

      const cOI = 1000 + Math.floor(rng()*5000);
      const cLTP = 80 + rng()*40;
      const pLTP = 60 + rng()*40;
      const pOI = 1000 + Math.floor(rng()*5000);
      const vals = [
        cOI.toString(),
        cLTP.toFixed(1),
        strike.toString(),
        pLTP.toFixed(1),
        pOI.toString()
      ];
      ctx.font = '10px monospace';
      for(let j=0;j<5;j++){
        const cx = x + w*colX[j];
        let col = C.text;
        if(j===1) col = C.green;
        if(j===3) col = C.red;
        if(j===2) col = isATM ? C.yellow : C.text;
        ctx.fillStyle = col;
        ctx.fillText(vals[j], cx - ctx.measureText(vals[j]).width/2, ry + rowH/2);
      }
    }
    // animated highlight row
    const hi = Math.floor((t*1.5) % rows);
    const hy = y + 30 + hi*rowH;
    const a = 0.15 + 0.15*Math.sin(t*6);
    ctx.fillStyle = 'rgba(79,209,255,'+a+')';
    ctx.fillRect(x+4, hy, w-8, rowH);
  }

  // ---------- positions table ----------
  function drawPositions(x,y,w,h,t,seed){
    const rng = mulberry32(seed);
    const rows = 6;
    const rowH = (h-26)/rows;
    ctx.font = '600 9px -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
    ctx.fillStyle = C.dim;
    ctx.textBaseline = 'middle';
    const cols = ['SYMBOL','QTY','AVG','LTP','P&L'];
    const colX = [0.1, 0.32, 0.5, 0.7, 0.9];
    cols.forEach((c,i)=>{
      ctx.fillText(c, x + w*colX[i] - ctx.measureText(c).width/2, y+14);
    });
    const syms = ['NIFTY','BANKNIFTY','RELIANCE','TCS','INFY','HDFC'];
    for(let i=0;i<rows;i++){
      const ry = y + 26 + i*rowH;
      ctx.strokeStyle = 'rgba(28,42,68,0.5)';
      ctx.beginPath();
      ctx.moveTo(x+4, ry+rowH);
      ctx.lineTo(x+w-4, ry+rowH);
      ctx.stroke();
      const qty = (rng()>0.5?1:-1) * (50 + Math.floor(rng()*200));
      const avg = 1000 + rng()*500;
      const ltp = avg + (rng()-0.5)*80;
      const pnl = (ltp-avg)*qty;
      const vals = [
        syms[i],
        qty.toString(),
        avg.toFixed(1),
        ltp.toFixed(1),
        (pnl>=0?'+':'')+pnl.toFixed(0)
      ];
      ctx.font = '10px monospace';
      for(let j=0;j<5;j++){
        const cx = x + w*colX[j];
        let col = C.text;
        if(j===4) col = pnl>=0?C.green:C.red;
        if(j===1) col = qty>=0?C.green:C.red;
        ctx.fillStyle = col;
        ctx.fillText(vals[j], cx - ctx.measureText(vals[j]).width/2, ry + rowH/2);
      }
    }
  }

  // ---------- watchlist ----------
  function drawWatchlist(x,y,w,h,t,seed){
    const rng = mulberry32(seed);
    const rows = 7;
    const rowH = (h-26)/rows;
    const syms = ['NIFTY 50','BANKNIFTY','FINNIFTY','MIDCPNIFTY','RELIANCE','TCS','INFY'];
    for(let i=0;i<rows;i++){
      const ry = y + 26 + i*rowH;
      if(i%2===0){
        ctx.fillStyle = 'rgba(17,27,46,0.5)';
        ctx.fillRect(x+4, ry, w-8, rowH);
      }
      ctx.font = '600 10px -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
      ctx.fillStyle = C.text;
      ctx.textBaseline = 'middle';
      ctx.fillText(syms[i], x+12, ry + rowH/2);
      const price = 20000 + rng()*4000;
      const chg = (rng()-0.5)*2;
      ctx.font = '10px monospace';
      ctx.fillStyle = C.text;
      ctx.fillText(price.toFixed(1), x + w*0.55, ry + rowH/2);
      ctx.fillStyle = chg>=0?C.green:C.red;
      ctx.fillText((chg>=0?'+':'')+chg.toFixed(2)+'%', x + w*0.82, ry + rowH/2);
      // sparkline
      const sx = x + w*0.62, sw = w*0.2;
      ctx.beginPath();
      for(let k=0;k<10;k++){
        const px = sx + sw*k/9;
        const py = ry + rowH/2 + Math.sin(k*1.3 + i + t*2)*4;
        if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.strokeStyle = chg>=0?C.green:C.red;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // ---------- desktop composition ----------
  function drawDesktop(t, alpha, scale, cx, cy){
    // alpha 0..1, scale around (cx,cy)
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.translate(-cx, -cy);

    // subtle grid background
    ctx.strokeStyle = 'rgba(28,42,68,0.35)';
    ctx.lineWidth = 1;
    for(let gx=0; gx<=W; gx+=40){
      ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke();
    }
    for(let gy=0; gy<=H; gy+=40){
      ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
    }

    // windows
    const appear = (t0, dur, t) => clamp((t - t0)/dur, 0, 1);

    // Charts (large, left)
    let a1 = appear(3.0, 0.8, t);
    if(a1 > 0){
      ctx.save();
      const s = easeOutBack(a1);
      ctx.translate(60, 60);
      ctx.scale(s, s);
      ctx.translate(-30, -30);
      panel(0, 0, 620, 380, 'CHARTS  ·  NIFTY 50  ·  1D');
      drawChart(10, 34, 600, 336, t, 42);
      ctx.restore();
    }

    // Option Chain (right)
    let a2 = appear(3.6, 0.8, t);
    if(a2 > 0){
      ctx.save();
      const s = easeOutBack(a2);
      ctx.translate(720, 60);
      ctx.scale(s, s);
      ctx.translate(-60, -30);
      panel(0, 0, 500, 380, 'OPTION CHAIN  ·  NIFTY  WEEKLY');
      drawOptionChain(10, 34, 480, 336, t, 7);
      ctx.restore();
    }

    // Positions (bottom left)
    let a3 = appear(4.2, 0.8, t);
    if(a3 > 0){
      ctx.save();
      const s = easeOutBack(a3);
      ctx.translate(60, 460);
      ctx.scale(s, s);
      ctx.translate(-40, -40);
      panel(0, 0, 500, 220, 'POSITIONS  ·  LIVE');
      drawPositions(10, 34, 480, 176, t, 11);
      ctx.restore();
    }

    // Watchlist (bottom right)
    let a4 = appear(4.8, 0.8, t);
    if(a4 > 0){
      ctx.save();
      const s = easeOutBack(a4);
      ctx.translate(600, 460);
      ctx.scale(s, s);
      ctx.translate(-40, -40);
      panel(0, 0, 620, 220, 'WATCHLIST  ·  MY MARKETS');
      drawWatchlist(10, 34, 600, 176, t, 23);
      ctx.restore();
    }

    ctx.restore();
  }

  // ---------- mobile landscape ----------
  function drawMobile(t, alpha, scale, cx, cy){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.translate(-cx, -cy);

    const mw = 1080, mh = 560;
    const mx = (W - mw)/2, my = (H - mh)/2;

    // phone body
    ctx.save();
    ctx.shadowColor = 'rgba(79,209,255,0.5)';
    ctx.shadowBlur = 60;
    ctx.fillStyle = '#0a0f1a';
    roundRect(mx-16, my-16, mw+32, mh+32, 40);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#2b3f63';
    ctx.lineWidth = 2;
    roundRect(mx-16, my-16, mw+32, mh+32, 40);
    ctx.stroke();

    // screen
    ctx.fillStyle = '#05070d';
    roundRect(mx, my, mw, mh, 26);
    ctx.fill();

    // split: chart left, option chain right
    const halfW = (mw - 40)/2;
    const chX = mx + 20, chY = my + 20, chH = mh - 40;
    const ocX = mx + 20 + halfW + 20;

    // chart panel
    panel(chX, chY, halfW, chH, 'CHARTS  ·  NIFTY');
    drawChart(chX+10, chY+34, halfW-20, chH-44, t, 88);

    // option chain panel
    panel(ocX, chY, halfW, chH, 'OPTION CHAIN');
    drawOptionChain(ocX+10, chY+34, halfW-20, chH-44, t, 42);

    // bottom bar
    ctx.fillStyle = 'rgba(79,209,255,0.1)';
    roundRect(mx+20, my+mh-42, mw-40, 26, 8);
    ctx.fill();
    ctx.fillStyle = C.accent;
    ctx.font = '600 12px -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('SAHI  ·  Single Screen Trading', mx+32, my+mh-29);

    // notch
    ctx.fillStyle = '#000';
    roundRect(mx+mw/2-60, my+6, 120, 14, 7);
    ctx.fill();

    ctx.restore();
  }

  // ---------- starfield (deterministic) ----------
  const stars = (function(){
    const rng = mulberry32(1337);
    const arr = [];
    for(let i=0;i<180;i++){
      arr.push({x: rng()*W, y: rng()*H, r: rng()*1.2+0.2, p: rng()*Math.PI*2, s: 0.5+rng()*1.5});
    }
    return arr;
  })();

  function drawStars(t, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    for(const s of stars){
      const tw = 0.5 + 0.5*Math.sin(t*s.s + s.p);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(200,220,255,'+(0.15 + tw*0.5)+')';
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------- main render ----------
  function render(t){
    // background
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // stars fade in after dot
    const starAlpha = smoothstep(2.0, 5.0, t) * (1 - smoothstep(24, 26, t));
    drawStars(t, starAlpha);

    // ---- Phase 1: single dot (0-3) ----
    if(t < 3.2){
      const dotAlpha = smoothstep(0.2, 0.8, t) * (1 - smoothstep(2.6, 3.2, t));
      const pulse = 0.5 + 0.5*Math.sin(t*4);
      const r = 4 + pulse*2;
      ctx.save();
      ctx.globalAlpha = dotAlpha;
      ctx.shadowColor = C.accent;
      ctx.shadowBlur = 30 + pulse*20;
      ctx.beginPath();
      ctx.arc(W/2, H/2, r, 0, Math.PI*2);
      ctx.fillStyle = C.accent;
      ctx.fill();
      ctx.restore();
    }

    // ---- Phase 2: desktop appears (3-18) ----
    if(t >= 3.0 && t < T.zoom1){
      // camera zoom in/out at multiple scales
      let scale = 1.0;
      let cx = W/2, cy = H/2;
      if(t >= 10 && t < 18){
        const p = (t - 10) / 8;
        // zoom in then out
        const zoom = Math.sin(p * Math.PI);
        scale = 1.0 + zoom * 0.35;
        cx = W/2 + Math.sin(p*Math.PI*2)*80;
        cy = H/2 + Math.cos(p*Math.PI*2)*40;
      }
      drawDesktop(t, 1, scale, cx, cy);
    }

    // ---- Phase 3: zoom out to point (18-26) ----
    if(t >= T.zoom1 && t < T.pullback){
      const p = clamp((t - T.zoom1)/(T.pullback - T.zoom1), 0, 1);
      const e = easeInOutCubic(p);
      const scale = lerp(1.0, 0.001, e);
      const alpha = lerp(1.0, 0.0, smoothstep(0.7, 1.0, p));
      drawDesktop(t, alpha, scale, W/2, H/2);

      // the point remains
      const dotAlpha = smoothstep(0.6, 1.0, p);
      if(dotAlpha > 0){
        const pulse = 0.5 + 0.5*Math.sin(t*6);
        const r = 2 + pulse*2;
        ctx.save();
        ctx.globalAlpha = dotAlpha;
        ctx.shadowColor = C.accent;
        ctx.shadowBlur = 20 + pulse*15;
        ctx.beginPath();
        ctx.arc(W/2, H/2, r, 0, Math.PI*2);
        ctx.fillStyle = C.accent;
        ctx.fill();
        ctx.restore();
      }
    }

    // ---- Phase 4: point in space (26-30) ----
    if(t >= T.pullback && t < 30){
      const pulse = 0.5 + 0.5*Math.sin(t*4);
      const r = 3 + pulse*2.5;
      ctx.save();
      ctx.shadowColor = C.accent;
      ctx.shadowBlur = 30 + pulse*20;
      ctx.beginPath();
      ctx.arc(W/2, H/2, r, 0, Math.PI*2);
      ctx.fillStyle = C.accent;
      ctx.fill();
      ctx.restore();
      // expanding rings
      for(let i=0;i<3;i++){
        const ph = ((t*0.6 + i*0.33) % 1);
        const rr = ph * 80;
        const a = (1-ph)*0.5;
        ctx.beginPath();
        ctx.arc(W/2, H/2, rr, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(79,209,255,'+a+')';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    // ---- Phase 5: zoom into mobile (30-33) ----
    if(t >= 30 && t < T.mobile){
      const p = clamp((t - 30)/(T.mobile - 30), 0, 1);
      const e = easeOutCubic(p);
      const scale = lerp(0.001, 1.0, e);
      drawMobile(t, e, scale, W/2, H/2);
    }

    // ---- Phase 6: mobile screen (33-46) ----
    if(t >= T.mobile){
      const p = clamp((t - T.mobile)/(T.end - T.mobile), 0, 1);
      drawMobile(t, 1, 1, W/2, H/2);

      // title overlay near end
      const titleAlpha = smoothstep(0.55, 0.85, p);
      if(titleAlpha > 0){
        ctx.save();
        ctx.globalAlpha = titleAlpha;
        // darken bottom
        const g = ctx.createLinearGradient(0, H-200, 0, H);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.85)');
        ctx.fillStyle = g;
        ctx.fillRect(0, H-200, W, 200);

        // text
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = C.accent;
        ctx.shadowBlur = 30;
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 42px -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
        ctx.fillText('Single Screen Trading', W/2, H-110);
        ctx.font = '600 22px -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
        ctx.fillStyle = C.accent;
        ctx.fillText('on  SAHI', W/2, H-62);
        ctx.restore();
      }
    }

    // subtle vignette
    const vg = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.9);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // ---------- seek ----------
  window.seek = function(t){
    t = clamp(t, 0, window.DURATION);
    render(t);
  };

  // ---------- play ----------
  let start = null;
  function loop(ts){
    if(start === null) start = ts;
    const elapsed = ((ts - start)/1000) % window.DURATION;
    window.seek(elapsed);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

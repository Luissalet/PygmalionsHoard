<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de tareas</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #ecfdf5; color: #064e3b; }
  .card { max-width: 560px; margin: 56px auto; background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(6, 78, 59, 0.12); padding: 28px; }
  h1 { margin: 0 0 18px; font-size: 30px; }
  form { display: flex; gap: 10px; }
  input[type=text] { flex: 1; border: 2px solid #a7f3d0; border-radius: 10px; padding: 12px; font-size: 16px; }
  form button { background: #059669; color: #fff; border: 0; border-radius: 10px; padding: 0 20px; font-size: 16px; font-weight: 700; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 20px 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid #d1fae5; font-size: 17px; }
  li.done span { text-decoration: line-through; color: #9ca3af; }
  .filters { display: flex; gap: 8px; align-items: center; }
  .filters button { border: 1px solid #a7f3d0; background: #fff; color: #065f46; border-radius: 8px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .filters button.on { background: #065f46; color: #fff; }
  #left { margin-left: auto; color: #047857; font-size: 14px; font-weight: 700; }
  .empty { color: #6b7280; font-style: italic; padding: 12px 4px; }
  @media (max-width: 600px) { .card { margin: 16px; padding: 18px; } h1 { font-size: 24px; } }
</style>
</head>
<body>
<div class="card">
  <h1>Lista de tareas</h1>
  <form id="new"><input type="text" id="text" placeholder="¿Qué hay que hacer?" autocomplete="off"><button type="submit">Añadir</button></form>
  <ul id="list"></ul>
  <div class="filters"><button data-f="all" class="on">Todas</button><button data-f="open">Pendientes</button><button data-f="done">Hechas</button><span id="left">0 pendientes</span></div>
</div>
<script>
  const tasks = [];
  let filter = 'all';
  const draw = () => {
    const list = document.getElementById('list');
    list.innerHTML = '';
    const shown = tasks.filter((t) => filter === 'all' || (filter === 'done') === t.done);
    if (!shown.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No hay tareas'; list.appendChild(e); }
    shown.forEach((t) => {
      const li = document.createElement('li');
      if (t.done) li.className = 'done';
      const box = document.createElement('input');
      box.type = 'checkbox'; box.checked = t.done; box.setAttribute('aria-label', t.text);
      box.addEventListener('change', () => { t.done = box.checked; draw(); });
      const span = document.createElement('span'); span.textContent = t.text;
      li.append(box, span); list.appendChild(li);
    });
    const left = tasks.filter((t) => !t.done).length;
    document.getElementById('left').textContent = left + (left === 1 ? ' pendiente' : ' pendientes');
    document.querySelectorAll('.filters button').forEach((b) => b.classList.toggle('on', b.dataset.f === filter));
  };
  document.getElementById('new').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('text');
    const text = input.value.trim();
    if (text) { tasks.push({ text, done: false }); input.value = ''; draw(); }
  });
  document.querySelectorAll('.filters button').forEach((b) => b.addEventListener('click', () => { filter = b.dataset.f; draw(); }));
  draw();
</script>
</body>
</html>

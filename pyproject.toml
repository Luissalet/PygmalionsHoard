[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygmalion-hoard"
version = "0.1.0"
description = "A local studio to adapt language models: datasets, LoRA and QLoRA training, merges, GGUF quantization, context extension, evaluation and publishing, with a dashboard and MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "safetensors>=0.4",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "safetensors>=0.4"]
icon = ["pillow>=11"]

[project.scripts]
pygmalion-hoard = "pygmalion_hoard.__main__:main"

[tool.setuptools.packages.find]
include = ["pygmalion_hoard*"]

[tool.setuptools.package-data]
pygmalion_hoard = ["static/**/*", "calib/*.txt", "workers/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
